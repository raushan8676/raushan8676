<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#0d0e16"/>
    <rect width="100%" height="100%" fill="url(#dots)"/>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&amp;family=Fira+Code:wght@400;600&amp;display=swap');
    :root {
        --bg-main: #0d0e16;
        --accent-cyan: #22d3ee;
        --accent-violet: #a78bfa;
        --accent-pink: #f472b6;
        --text-primary: #f6f7ff;
        --text-secondary: #858aa6;
        --card-bg: #111321;
    }
    .text-primary { fill: var(--text-primary); font-family: 'Outfit', sans-serif; }
    .text-secondary { fill: var(--text-secondary); font-family: 'Outfit', sans-serif; }
    .text-mono { fill: var(--accent-cyan); font-family: 'Fira Code', monospace; }
    .heading { font-weight: 800; font-size: 32px; font-family: 'Outfit', sans-serif; }
    .subheading { font-weight: 600; font-size: 20px; font-family: 'Outfit', sans-serif; }
    
    .card { fill: var(--card-bg); stroke: url(#border-gradient); stroke-width: 1px; rx: 16px; ry: 16px; }
    
    .glow { filter: drop-shadow(0 0 10px rgba(167, 139, 250, 0.3)); }
    
    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.05); }
    }
    .anim-pulse { animation: pulse 3s infinite ease-in-out; }
    
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }
    .anim-float { animation: float 6s infinite ease-in-out; }
</style>
<defs>
    <linearGradient id="border-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
        <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#f472b6" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#22d3ee" />
        <stop offset="50%" stop-color="#a78bfa" />
        <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.5" fill="#858aa6" opacity="0.1"/>
    </pattern>
</defs>
    
    <g transform="translate(40, 50)">
        <text x="0" y="0" class="heading" fill="url(#text-gradient)">📊 Development Focus</text>
        <rect x="0" y="15" width="50" height="3" fill="#22d3ee"/>
        
        <g transform="translate(0, 50)">
            <text x="0" y="15" class="text-primary" font-size="16" font-weight="600">Backend</text>
            <rect x="100" y="4" width="380" height="12" rx="6" fill="#22d3ee"/>
            <rect x="480" y="4" width="40" height="12" rx="6" fill="#22d3ee" fill-opacity="0.3"/>
            <text x="540" y="15" class="text-secondary" font-size="14">Laravel / PHP</text>

            <text x="0" y="45" class="text-primary" font-size="16" font-weight="600">Frontend</text>
            <rect x="100" y="34" width="320" height="12" rx="6" fill="#a78bfa"/>
            <rect x="420" y="34" width="100" height="12" rx="6" fill="#a78bfa" fill-opacity="0.3"/>
            <text x="540" y="45" class="text-secondary" font-size="14">React / JavaScript</text>

            <text x="0" y="75" class="text-primary" font-size="16" font-weight="600">Database</text>
            <rect x="100" y="64" width="340" height="12" rx="6" fill="#f472b6"/>
            <rect x="440" y="64" width="80" height="12" rx="6" fill="#f472b6" fill-opacity="0.3"/>
            <text x="540" y="75" class="text-secondary" font-size="14">MySQL / SQL</text>

            <text x="0" y="105" class="text-primary" font-size="16" font-weight="600">API</text>
            <rect x="100" y="94" width="320" height="12" rx="6" fill="#22d3ee"/>
            <rect x="420" y="94" width="100" height="12" rx="6" fill="#22d3ee" fill-opacity="0.3"/>
            <text x="540" y="105" class="text-secondary" font-size="14">REST APIs</text>

            <text x="0" y="135" class="text-primary" font-size="16" font-weight="600">Tools</text>
            <rect x="100" y="124" width="340" height="12" rx="6" fill="#a78bfa"/>
            <rect x="440" y="124" width="80" height="12" rx="6" fill="#a78bfa" fill-opacity="0.3"/>
            <text x="540" y="135" class="text-secondary" font-size="14">Git / GitHub / Postman</text>
        </g>
    </g>
</svg>